name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android

      # Google sign-in setup for the generated android/ project
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json || { echo "google-services.json is empty: add the GOOGLE_SERVICES_JSON_BASE64 secret"; exit 1; }
      - name: Include Google sign-in in the app
        run: sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
      - name: Use the fixed signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore || { echo "keystore is empty: add the DEBUG_KEYSTORE_BASE64 secret"; exit 1; }
      - name: Make the build sign with the fixed key
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
      - name: Show the signing fingerprint
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"
      - name: Print Firebase and signing details
        run: |
          J=android/app/google-services.json
          echo "Signing key SHA-1: $(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA1:' | sed 's/.*SHA1: //')"
          echo "project_id:     $(jq -r '.project_info.project_id' $J)"
          echo "project_number: $(jq -r '.project_info.project_number' $J)"
          echo "package_name:   $(jq -r '.client[].client_info.android_client_info.package_name' $J)"
          echo "Android clients (type 1) cert hashes in the file:"
          jq -r '.client[].oauth_client[]? | select(.client_type==1) | .android_info.certificate_hash' $J
          echo "Web clients (type 3) in the file: $(jq '[.client[].oauth_client[]? | select(.client_type==3)] | length' $J)"

      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Show APK signing fingerprint
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-1"
      # Put the APK and the update file on the website, then publish it. Runs only on main.
      - name: Add the APK and update file to the website
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/App.jsx)
          test -n "$VERSION" || { echo "Could not read APP_VERSION from src/App.jsx"; exit 1; }
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/downloads/sprout.apk
          jq -n --arg v "$VERSION" --arg u "https://sprout-ledger.web.app/downloads/sprout.apk" --arg n "$(git log -1 --pretty=%s)" \
            '{version:$v,url:$u,notes:$n}' > dist/version.json
          cat dist/version.json
      - name: Publish the website
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPROUT_LEDGER }}
          projectId: sprout-ledger
          channelId: live
      - uses: actions/upload-artifact@v4
        with:
          name: sprout-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
